name: release

# 打 tag 才发版。发版前必须先过测试 —— 一个没有测试背书的 zip 只是压缩包。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖并跑契约测试
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r tests/requirements.txt
          python -m pytest tests/ -q

      - name: 打包（只含被跟踪文件，不含 .git 与缓存）
        run: |
          set -eu
          mkdir -p dist
          git archive --format=zip \
            --prefix="visual-3d-forge-${GITHUB_REF_NAME}/" \
            -o "dist/visual-3d-forge-${GITHUB_REF_NAME}.zip" HEAD
          ls -lh dist/

      - name: 从 CHANGELOG 取 release notes
        run: |
          set -eu
          # 取当前版本号对应的那一段，避免 notes 在两处各写一遍、各自过期
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { if (found) exit; if (index($0, tag)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            echo "notes: $(wc -l < /tmp/notes.md) 行，来自 CHANGELOG"
          else
            echo "CHANGELOG 里没有 ${GITHUB_REF_NAME}，退回自动生成"
          fi

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -s /tmp/notes.md ]; then
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --title "visual-3d-forge ${GITHUB_REF_NAME}" \
              --notes-file /tmp/notes.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --title "visual-3d-forge ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
