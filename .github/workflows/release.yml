name: release

# 打 tag 才发版。发版前必须先过测试 —— 一个没有测试背书的 zip 只是压缩包。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装并跑契约测试
        run: |
          python -m pip install --quiet --upgrade pip pytest
          python -m pytest tests/ -q

      - name: 打包（只含被跟踪文件，不含 .git 与缓存）
        run: |
          set -eu
          mkdir -p dist
          git archive --format=zip \
            --prefix="visual-3d-forge-${GITHUB_REF_NAME}/" \
            -o "dist/visual-3d-forge-${GITHUB_REF_NAME}.zip" HEAD
          ls -lh dist/

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "visual-3d-forge ${GITHUB_REF_NAME}" \
            --generate-notes
