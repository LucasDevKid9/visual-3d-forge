name: pages

# 在线实验台。构建过程刻意只有三步：复制 vendor、改写相对路径、上传。
# 不做打包、不装 npm —— 实验台本身就是零构建的产物，部署不该引入它不需要的环节。

on:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - "assets/vendor/**"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点
        run: |
          set -eu
          mkdir -p site/assets
          # 本地是 /playground/index.html，引用 ../assets/vendor/
          # 线上把 index.html 提到根，因此去掉一层 ../
          # 本地是 ../assets/，线上把 index.html 提到根：../ 会跳出站点根，改成 ./
          # 注意不能写成 "assets/..."：import map 的地址必须是 URL-like
          # （以 ./ ../ / 或绝对 URL 开头），缺 ./ 会被解析成 null，模块直接不加载。
          sed 's|\.\./assets/|./assets/|g' playground/index.html > site/index.html
          cp -r assets/vendor site/assets/vendor

          # 三条硬检查：替换干净、依赖齐、没有残留外链
          if grep -q '\.\./assets' site/index.html; then
            echo "::error::站点根仍有 .. 相对路径，会跳出 /<repo>/ 前缀"; exit 1
          fi

          python3 - <<'PY'
          import json, re, sys
          html = open("site/index.html", encoding="utf-8").read()
          m = re.search(r'<script type="importmap">(.*?)</script>', html, re.S)
          if not m:
              sys.exit("站点缺少 importmap")
          imports = json.loads(m.group(1))["imports"]
          bad = [v for v in imports.values()
                 if not v.startswith(("./", "../", "/", "http://", "https://"))]
          if bad:
              sys.exit(f"import map 地址必须是 URL-like，否则会被解析成 null：{bad}")
          print("importmap ok:", imports)
          PY
          test -f site/assets/vendor/three.module.js
          test -f site/assets/vendor/addons/controls/OrbitControls.js
          test -f site/assets/vendor/addons/environments/RoomEnvironment.js
          if grep -Eq 'cdn\.jsdelivr|unpkg\.com' site/index.html; then
            echo "::error::实验台不应依赖 CDN"; exit 1
          fi
          echo "site 组装完成：$(du -sh site | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
