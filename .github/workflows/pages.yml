name: pages

# 站点结构：根 = 旗舰示例（NOVA X-01），/playground/ = 参数化实验台。
# 构建只做搬运：两个页面都是零构建产物，部署不该引入它们不需要的环节。

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "playground/**"
      - "assets/vendor/**"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点
        run: |
          set -eu
          mkdir -p site/playground site/assets

          # 旗舰示例：单文件产物，直接放根目录
          cp demo/index.html site/index.html

          # 参数化实验台：挂在 /playground/ 下，相对路径 ../assets/ 正好指向站点根
          cp playground/index.html site/playground/index.html
          cp -r assets/vendor site/assets/vendor

          python3 - <<'PY'
          import json, re, sys, pathlib

          # 1) 旗舰示例必须自包含：不许有 importmap，不许有远程脚本
          demo = pathlib.Path("site/index.html").read_text(encoding="utf-8")
          if '<script type="importmap">' in demo:
              sys.exit("demo 不应再有 importmap —— 依赖已内联")
          for pat in ("cdn.jsdelivr", "unpkg.com", "cdnjs.cloudflare"):
              if pat in demo:
                  sys.exit(f"demo 仍在引用远程资源：{pat}")
          if "<script src=" in demo:
              sys.exit("demo 必须是单文件，不允许外部脚本")
          print(f"demo ok: {len(demo.encode())//1024} KB, 单文件自包含")

          # 2) 实验台的 importmap 地址必须是 URL-like
          pg = pathlib.Path("site/playground/index.html").read_text(encoding="utf-8")
          m = re.search(r'<script type="importmap">(.*?)</script>', pg, re.S)
          if not m:
              sys.exit("实验台缺少 importmap")
          imports = json.loads(m.group(1))["imports"]
          bad = [v for v in imports.values()
                 if not v.startswith(("./", "../", "/", "http://", "https://"))]
          if bad:
              sys.exit(f"import map 地址必须是 URL-like，否则会被解析成 null：{bad}")
          if 'cdn.jsdelivr' in pg or 'unpkg.com' in pg:
              sys.exit("实验台不应依赖 CDN")
          print("importmap ok:", imports)
          PY

          test -f site/assets/vendor/three.module.js
          test -f site/assets/vendor/addons/controls/OrbitControls.js
          echo "site 组装完成：$(du -sh site | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
