name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          # 运行时依赖是 0（scripts/ 只用标准库）。
          # 这里装的是测试自身的依赖：断言 GIF 是动图需要 Pillow，
          # 解析 workflow 需要 PyYAML。
          python -m pip install -r tests/requirements.txt

      - name: 契约测试（68 项）
        run: python -m pytest tests/ -q

      - name: 骨架校验（D0 / D2）
        run: |
          python scripts/validate_scene.py assets/scaffold/forged-scene.html --strict
          python scripts/validate_scene.py assets/scaffold/forged-scene.vendor.html --strict

      - name: 示例校验（strict）
        run: |
          for f in examples/*/*.html; do
            echo "→ $f"
            python scripts/validate_scene.py "$f" --strict
          done

      - name: 打包链路（D2 → D1 → 零外链）
        run: |
          python scripts/bundle.py --self-test
          python scripts/vendor.py --self-test
          python scripts/bundle.py --src assets/scaffold/forged-scene.vendor.html \
            --out /tmp/d1.html --vendor assets/vendor
          python scripts/validate_scene.py /tmp/d1.html --strict
          n=$(grep -oE 'https?://[^"'"'"' ]+' /tmp/d1.html | wc -l)
          echo "远程引用数：$n"
          test "$n" -eq 0
