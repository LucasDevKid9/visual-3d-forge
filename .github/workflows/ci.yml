name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pytest
      - name: 契约测试
        run: python -m pytest tests/ -q
      - name: 骨架校验（D0 / D2）
        run: |
          python scripts/validate_scene.py assets/scaffold/forged-scene.html --strict
          python scripts/validate_scene.py assets/scaffold/forged-scene.vendor.html --strict
      - name: 打包链路（D2 → D1）
        run: |
          python scripts/bundle.py --self-test
          python scripts/vendor.py --self-test
