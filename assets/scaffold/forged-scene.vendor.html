<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>三维造物引擎 · 骨架场景</title>
<style>
  :root{
    --bg1:#1a1917; --bg2:#0e0d0c; --ink:#e9e4dc; --muted:#9a938a; --line:#3a3632;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg1);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    overflow:hidden}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}

  /* ---------- HUD：3D 负责形体，2D 负责解释 ---------- */
  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
    justify-content:space-between;padding:clamp(14px,2.4vw,28px)}
  .top{max-width:min(560px,86vw)}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  h1{margin:.5em 0 .35em;font-size:clamp(20px,3.4vw,34px);font-weight:600;letter-spacing:-.01em;line-height:1.15}
  .sub{margin:0;font-size:clamp(12px,1.5vw,14px);line-height:1.6;color:var(--muted);max-width:38em}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
  .scale{font-size:11px;color:var(--muted);letter-spacing:.06em}
  .scale .bar{display:block;height:2px;background:var(--ink);width:64px;margin-bottom:4px;opacity:.7}
  .tip{font-size:11px;color:var(--muted);letter-spacing:.06em}
  .fps{font-variant-numeric:tabular-nums;color:#6f675e}
  #fallback{position:fixed;inset:0;display:none;place-items:center;background:var(--bg1);
    padding:8vw;text-align:center;line-height:1.8}
  #fallback[data-on]{display:grid}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud">
  <header class="top">
    <div class="kicker">Visual 3D Forge · Scaffold</div>
    <h1>参数旋压体 · 骨架示例</h1>
    <p class="sub">这是一个管线齐备的骨架：三光制、IBL 环境、接触阴影、包围球推导机位、轨道限位、自适应降级、后台暂停。把 <code>buildSubject()</code> 换成你的构件树即可。</p>
  </header>

  <footer class="bottom">
    <div class="legend">
      <span><i style="background:#b8b0a4"></i>阳极氧化铝</span>
      <span><i style="background:#57524b"></i>ABS 塑料</span>
      <span><i style="background:#ffb257"></i>状态指示</span>
    </div>
    <div class="scale">
      <span class="bar" aria-hidden="true"></span>
      <span id="scaleText">100 mm</span>
    </div>
    <div class="tip">拖拽旋转 · 双指/滚轮缩放 · <span class="fps" id="fps">--</span></div>
  </footer>
</div>

<div id="fallback">
  <div>
    <h2 style="margin:0 0 8px;font-size:20px">当前设备不支持 WebGL</h2>
    <p class="sub" style="margin:0 auto">
      已切换为静态说明模式。主体为 460 mm 高旋压体，最大直径 380 mm，<br>
      顶部收口至 160 mm，环向分布 18 片散热筋，底部为 30 mm 塑料基座。
    </p>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"../vendor/three.module.js",
  "three/addons/":"../vendor/addons/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const stage = document.getElementById('stage');
const fpsEl = document.getElementById('fps');
const scaleEl = document.getElementById('scaleText');
const isMobile = matchMedia('(max-width: 820px)').matches;

/* ============ 0. 兜底：没有 WebGL 就展示静态说明，绝不留白屏 ============ */
function hasWebGL() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch (e) { return false; }
}

/* ============ 1. 尺度表：所有魔法数字从这里派生 ============ */
const S = { H: 0.46, Rmax: 0.19, Rneck: 0.08, base: 0.20, finN: 18, finR: 0.215 };

/* ============ 2. 材质：五通道描述同一块表面 ============ */
function makeMaterials() {
  const alu = new THREE.MeshStandardMaterial({
    color: 0xb8b0a4, metalness: 1.0, roughness: 0.32,     // 金属=1，粗糙度带空间感
    roughnessMap: grainTexture(0.55)                       // 机加工细纹
  });
  const plastic = new THREE.MeshStandardMaterial({
    color: 0x57524b, metalness: 0.0, roughness: 0.48      // 塑料不给中间金属度
  });
  const led = new THREE.MeshStandardMaterial({
    color: 0x2a1a08, emissive: 0xffb257, emissiveIntensity: 3.2, roughness: 0.2, metalness: 0
  });
  return { alu, plastic, led };
}

/* 程序化粗糙度贴图：同一噪声派生，避免「材质分裂」 */
function grainTexture(contrast = 0.5) {
  const n = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = n;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(n, n);
  let seed = 20261116;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  for (let i = 0; i < n * n; i++) {
    const v = 150 + (rnd() - 0.5) * 200 * contrast;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // 轻度模糊，得到工艺纹而不是噪点
  ctx.filter = 'blur(1px)';
  ctx.drawImage(cv, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}

/* ============ 3. 构件树：每个部件有名有父，禁止无名 mesh ============ */
function buildSubject() {
  const mats = makeMaterials();
  const root = new THREE.Group(); root.name = '整机';

  const baseG = new THREE.Group(); baseG.name = '基座组';
  const base = new THREE.Mesh(new THREE.CylinderGeometry(S.base, S.base * 0.96, 0.03, 64), mats.plastic);
  base.name = '基座'; base.position.y = 0.015;
  baseG.add(base);

  const bodyG = new THREE.Group(); bodyG.name = '主体组';
  const profile = [
    [0.001, 0.000], [0.170, 0.000], [0.188, 0.030], [0.190, 0.090],
    [0.172, 0.140], [0.150, 0.250], [0.186, 0.310], [0.186, 0.360],
    [0.150, 0.405], [0.090, 0.440], [0.001, 0.460]
  ].map(([r, y]) => new THREE.Vector2(r, y));
  const body = new THREE.Mesh(new THREE.LatheGeometry(profile, 96), mats.alu);
  body.name = '旋压主体'; body.position.y = 0.03;
  bodyG.add(body);

  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.156, 0.011, 20, 96), mats.alu);
  ring.name = '腰部环'; ring.rotation.x = Math.PI / 2; ring.position.y = 0.28;
  bodyG.add(ring);

  const led = new THREE.Mesh(new THREE.SphereGeometry(0.014, 24, 16), mats.led);
  led.name = '状态指示'; led.position.set(0.105, 0.335, 0.135);
  bodyG.add(led);

  const finG = new THREE.Group(); finG.name = '散热筋组';  // 重复单元 → 实例化
  const finGeo = new THREE.BoxGeometry(0.012, 0.10, 0.028);
  const fins = new THREE.InstancedMesh(finGeo, mats.alu, S.finN);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < S.finN; i++) {
    const a = (i / S.finN) * Math.PI * 2;
    dummy.position.set(Math.cos(a) * S.finR, 0.375, Math.sin(a) * S.finR);
    dummy.rotation.set(0, -a, 0);
    dummy.updateMatrix();
    fins.setMatrixAt(i, dummy.matrix);
  }
  fins.instanceMatrix.needsUpdate = true;
  fins.name = '散热筋×18';
  finG.add(fins);

  root.add(baseG, bodyG, finG);
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return root;
}

/* ============ 4. 场景装配 ============ */
function boot() {
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.AgXToneMapping;      // 色彩转换只做一次（由渲染器完成）
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x141311);

  const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.02, 40);

  /* ---- 4.1 IBL：零资产 studio 环境，金属可信度的来源 ---- */
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.55;

  /* ---- 4.2 三光制：主光定形体 / 补光保暗部 / 轮廓光剥离背景 ---- */
  const key = new THREE.DirectionalLight(0xfff1e0, 2.3);
  key.position.set(1.6, 2.6, 1.3);
  key.castShadow = true;
  key.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
  key.shadow.camera.near = 0.5;
  key.shadow.camera.far = 8;
  key.shadow.camera.left = -1; key.shadow.camera.right = 1;
  key.shadow.camera.top = 1; key.shadow.camera.bottom = -1;
  key.shadow.bias = -0.0006;
  key.shadow.radius = 3;
  scene.add(key);

  const fill = new THREE.HemisphereLight(0xc3d2e8, 0x241f1a, 0.38);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xdce8ff, 1.5);
  rim.position.set(-1.8, 1.2, -1.9);
  scene.add(rim);

  /* ---- 4.3 地面：接触处必须有暗，否则一定在漂浮 ---- */
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(2.2, 64),
    new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.42 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.002;
  ground.receiveShadow = true;
  ground.name = '地面';
  scene.add(ground);

  /* ---- 4.4 主体 ---- */
  const subject = buildSubject();
  scene.add(subject);

  /* ---- 4.5 机位：由包围球推导，不填固定距离 ---- */
  const bounds = new THREE.Box3().setFromObject(subject);
  const sphere = bounds.getBoundingSphere(new THREE.Sphere());
  const R = Math.max(sphere.radius, 0.001);
  const fovRad = THREE.MathUtils.degToRad(camera.fov);
  const fitDist = (R * 2.55) / Math.sin(fovRad / 2);
  const dir = new THREE.Vector3(0.66, 0.40, 0.70).normalize();

  camera.position.copy(sphere.center).addScaledVector(dir, fitDist);
  camera.lookAt(sphere.center);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(sphere.center);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.minPolarAngle = Math.PI * 0.14;
  controls.maxPolarAngle = Math.PI * 0.56;         // 不许到地面以下
  controls.minDistance = R * 1.5;
  controls.maxDistance = R * 4.2;
  controls.enablePan = false;
  controls.update();

  /* ---- 4.6 尺度锚：标尺按世界观换算 ---- */
  function updateScale() {
    // 画面底边对应视高 ≈ 2 * dist * tan(fov/2)
    const d = camera.position.distanceTo(controls.target);
    const viewH = 2 * d * Math.tan(fovRad / 2);
    const px = innerHeight * 0.72;             // 标尺像素长度
    const mm = (viewH / innerHeight) * px * 1000;
    const nice = [10, 20, 30, 50, 100, 150, 200, 300, 500, 1000]
      .reduce((a, b) => (Math.abs(b - mm) < Math.abs(a - mm) ? b : a), 10);
    scaleEl.textContent = nice + ' mm';
  }

  /* ---- 4.7 自适应降级：掉帧先降画质，不降帧率 ---- */
  let quality = 0;
  const grades = [1, 1.5, 2];                  // 依次尝试的像素比
  const dprCap = isMobile ? 1.5 : 2;
  const samples = [];
  function watchFPS(dt) {
    if (dt <= 0) return;
    samples.push(dt);
    if (samples.length < 40) return;
    const avg = samples.reduce((a, b) => a + b, 0) / samples.length;
    samples.length = 0;
    if (avg > 0.021 && quality < 2) {           // < ~48fps 就降一档
      quality++;
      renderer.setPixelRatio(Math.min(devicePixelRatio, grades[quality]) || dprCap);
      renderer.setSize(innerWidth, innerHeight);
    }
  }

  /* ---- 4.8 循环：dt 钳制 + 后台暂停 ---- */
  const clock = new THREE.Clock();
  let running = true;

  function tick() {
    if (!running) return;
    const dt = Math.min(clock.getDelta(), 1 / 30);
    controls.update();
    updateScale();
    renderer.render(scene, camera);
    fpsEl.textContent = dt > 0 ? Math.round(1 / dt) + ' fps' : '--';
    watchFPS(dt);
  }
  renderer.setAnimationLoop(tick);

  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running) { clock.getDelta(); renderer.setAnimationLoop(tick); }
    else { renderer.setAnimationLoop(null); }
  });

  /* ---- 4.9 resize：像素比与尺寸一起重算 ---- */
  let resizeTimer = 0;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, grades[quality] || dprCap));
      renderer.setSize(innerWidth, innerHeight);
    }, 120);
  });

  /* ---- 调试出口：把场景对象挂到 window，方便检查构件树 ---- */
  window.__forge = { scene, camera, renderer, controls, subject, THREE };
}

if (hasWebGL()) boot();
else document.getElementById('fallback').setAttribute('data-on', '');
</script>
</body>
</html>
