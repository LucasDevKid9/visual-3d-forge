<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Visual 3D Forge — 把一句话编译成可交付的三维场景">
  <title>Visual 3D Forge</title>
  <style>
    .bg      { fill: #0e0d0c; }
    .grain   { stroke: #ffffff; stroke-opacity: .045; }
    .ink     { fill: #ece7df; }
    .dim     { fill: #8a8378; }
    .accent  { fill: #c8a06a; }
    .line    { stroke: #c8a06a; stroke-opacity: .55; }
    .rule    { stroke: #ffffff; stroke-opacity: .10; }
    .mono    { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
    @media (prefers-color-scheme: light) {
      .bg     { fill: #f7f5f1; }
      .grain  { stroke: #000000; stroke-opacity: .05; }
      .ink    { fill: #1c1a17; }
      .dim    { fill: #6b6459; }
      .accent { fill: #8a6224; }
      .line   { stroke: #8a6224; stroke-opacity: .5; }
      .rule   { stroke: #000000; stroke-opacity: .12; }
    }
  </style>

  <rect width="1200" height="300" class="bg"/>
  <g class="grain">
    <path d="M0 75h1200M0 150h1200M0 225h1200"/>
    <path d="M150 0v300M300 0v300M450 0v300M600 0v300M750 0v300M900 0v300M1050 0v300"/>
  </g>

  <!-- 齿轮系：用 dasharray 的圆模拟齿廓，不依赖任何外部位图 -->
  <g transform="translate(985 150)" fill="none" class="line">
    <circle r="118" stroke-width="16" stroke-dasharray="7 6"/>
    <circle r="104" stroke-width="1" stroke-opacity=".35"/>
    <circle r="46" stroke-width="1.2"/>
    <circle r="34" stroke-width="1.6" stroke-dasharray="4 4"/>
    <g stroke-width="1.2">
      <circle cx="0" cy="-72" r="30" stroke-dasharray="4 4"/>
      <circle cx="62" cy="36" r="30" stroke-dasharray="4 4"/>
      <circle cx="-62" cy="36" r="30" stroke-dasharray="4 4"/>
      <path d="M0 0 L0 -72 M0 0 L62 36 M0 0 L-62 36" stroke-width="7" stroke-opacity=".5"/>
      <circle cx="0" cy="-72" r="9" stroke-opacity=".6"/>
      <circle cx="62" cy="36" r="9" stroke-opacity=".6"/>
      <circle cx="-62" cy="36" r="9" stroke-opacity=".6"/>
    </g>
  </g>

  <g transform="translate(72 96)">
    <text class="mono accent" font-size="12" letter-spacing="4.2">SKILL · v2.0.1 · MIT</text>
    <text class="sans ink" y="62" font-size="52" font-weight="600" letter-spacing="-1.4">Visual 3D Forge</text>
    <text class="sans dim" y="100" font-size="17" letter-spacing=".2">把「一句话 + 一张参考图」编译成一个能双击打开的三维网页</text>
  </g>

  <g transform="translate(72 258)">
    <text class="mono dim" font-size="12" letter-spacing="1.6">意图卡 → IR → 几何策略 → 代码 → 19 项契约校验</text>
    <text class="mono accent" x="404" font-size="12" letter-spacing="1.6">·  D0 / D1 / D2 / D3</text>
  </g>
  <path class="rule" d="M72 228h300"/>
</svg>
