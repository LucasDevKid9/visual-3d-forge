<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>行星齿轮减速器 · 爆炸视图</title>
<style>
  :root{
    --bg:#141312; --ink:#eae5dd; --muted:#948d83; --line:#332f2b; --accent:#c8a06a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;
    background:radial-gradient(circle at 52% 40%, #1d1b18 0%, #121110 58%, #0b0b0a 100%)}
  canvas{display:block}

  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
    justify-content:space-between;padding:clamp(14px,2.2vw,26px)}
  .kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  h1{margin:.55em 0 .4em;font-size:clamp(19px,3.1vw,30px);font-weight:600;letter-spacing:-.015em}
  .sub{margin:0;font-size:clamp(11px,1.35vw,13px);line-height:1.7;color:var(--muted);max-width:36em}
  .sub b{color:#bfb6aa;font-weight:500}

  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .left{display:flex;flex-direction:column;gap:12px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
  .ctrl{pointer-events:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:2px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--accent);cursor:pointer}
  .scale{font-size:11px;color:var(--muted);letter-spacing:.05em;text-align:right}
  .scale .bar{display:block;height:2px;background:var(--ink);width:66px;margin-left:auto;margin-bottom:5px;opacity:.65}

  #card{position:fixed;right:clamp(14px,2.2vw,26px);top:50%;transform:translateY(-50%);
    width:min(250px,64vw);padding:14px 16px;border:1px solid var(--line);border-radius:10px;
    background:rgba(20,19,18,.82);backdrop-filter:blur(8px);pointer-events:none;
    opacity:0;transition:opacity .2s}
  #card[data-on]{opacity:1}
  #card h3{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.02em}
  #card p{margin:0;font-size:11px;line-height:1.65;color:var(--muted)}
  #card .tag{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:.1em;
    color:var(--accent);text-transform:uppercase}

  #fallback{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);padding:8vw;text-align:center}
  #fallback[data-on]{display:grid}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud">
  <header>
    <div class="kicker">Visual 3D Forge · Example</div>
    <h1>行星齿轮减速器 · 爆炸视图</h1>
    <p class="sub">模数 2 mm，太阳轮 18 齿、行星轮 21 齿、内齿圈 60 齿，传动比 <b>i = 4.33</b>。
      拖动滑块分离构件，点击任一零件查看其作用与材料。</p>
  </header>

  <footer class="bottom">
    <div class="left">
      <div class="legend">
        <span><i style="background:#c9c4bb"></i>20CrMnTi 渗碳钢</span>
        <span><i style="background:#8d8880"></i>阳极氧化铝</span>
        <span><i style="background:#c8a06a"></i>铜衬套</span>
      </div>
      <div class="ctrl">
        <span>爆炸</span>
        <input id="explode" type="range" min="0" max="100" value="62" aria-label="爆炸视图">
        <span id="explodeVal">62%</span>
      </div>
    </div>
    <div class="scale">
      <span class="bar" aria-hidden="true"></span>
      50 mm
    </div>
  </footer>
</div>

<div id="card"><h3 id="cardTitle"></h3><p id="cardBody"></p><span class="tag" id="cardTag"></span></div>

<div id="fallback">
  <div>
    <h2 style="margin:0 0 10px;font-size:19px">当前设备不支持 WebGL</h2>
    <p class="sub" style="margin:0 auto">
      已切换为静态说明模式。本机为标准三级行星减速器：<br>
      内齿圈 60 齿固定，太阳轮 18 齿输入，3 个 21 齿行星轮由行星架输出，<br>
      传动比 1 + 60/18 ≈ 4.33，外形 φ140 × 22 mm。
    </p>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://fastly.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/":"https://fastly.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const stage = document.getElementById('stage');
const card = document.getElementById('card');
const cardTitle = document.getElementById('cardTitle');
const cardBody = document.getElementById('cardBody');
const cardTag = document.getElementById('cardTag');
const explodeEl = document.getElementById('explode');
const explodeVal = document.getElementById('explodeVal');
const isMobile = matchMedia('(max-width: 820px)').matches;

/* ============ 0. 兜底：没有 WebGL 就给静态说明，绝不留白屏 ============ */
function hasWebGL() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch (e) { return false; }
}
if (!hasWebGL()) {
  document.getElementById('fallback').setAttribute('data-on', '');
} else {
  boot();
}

function boot() {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = null;   // 背景交给 CSS 暗角
  scene.fog = new THREE.Fog(0x141312, 0.55, 1.5);

  const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.01, 10);

  /* 环境贴图：金属没有 IBL 就是黑的。RoomEnvironment 程序化生成，零外部文件 */
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  /* ============ 1. 尺度表（mm）：所有数字从这里派生，代码里不再出现魔法值 ============ */
  const S = {
    m: 0.002,                 // 模数 2 mm
    zSun: 18, zPlanet: 21, zRing: 60,
    h: 0.022,                 // 齿宽 22 mm
    ringR: 0.060, ringOut: 0.070,
    plateT: 0.006, pinR: 0.005,
    shaftInR: 0.006, shaftOutR: 0.008,
    baseR: 0.075
  };
  const m = S.m;
  const rSun = m * S.zSun / 2;          // 18 mm
  const rPlanet = m * S.zPlanet / 2;    // 21 mm
  const rRing = m * S.zRing / 2;        // 60 mm
  const i = 1 + S.zRing / S.zSun;       // 4.333

  /* ============ 2. 材质：五通道描述同一块表面 ============ */
  const steel = new THREE.MeshStandardMaterial({
    color: 0xb6bcc0, metalness: 1.0, roughness: 0.34, envMapIntensity: 1.05,
    roughnessMap: brushed(0.38)
  });
  const alu = new THREE.MeshStandardMaterial({
    color: 0x4c5054, metalness: 1.0, roughness: 0.46, envMapIntensity: 0.9
  });
  const bronze = new THREE.MeshStandardMaterial({
    color: 0xb07a35, metalness: 1.0, roughness: 0.36, envMapIntensity: 0.95
  });
  const pedestal = new THREE.MeshStandardMaterial({ color: 0x2b2825, metalness: 0.0, roughness: 0.92 });

  /* 机加工细纹：只作用于粗糙度，颜色与法线不动，避免材质分裂 */
  function brushed(contrast) {
    const n = 256, cv = document.createElement('canvas');
    cv.width = cv.height = n;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(n, n);
    for (let y = 0; y < n; y++) {
      const v = 255 * (1 - contrast * (0.5 + 0.5 * Math.sin(y * 0.9)));
      for (let x = 0; x < n; x++) {
        const k = (y * n + x) * 4;
        img.data[k] = img.data[k + 1] = img.data[k + 2] = v;
        img.data[k + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(3, 1);
    t.colorSpace = THREE.NoColorSpace;   // 数据贴图必须是 NoColorSpace
    return t;
  }

  /* ============ 3. 构件树：每个零件有名字、有材料、有爆炸方向 ============ */
  const root = new THREE.Group();
  scene.add(root);

  function toothRing(count, r, width, height, depth, mat, dir = 1) {
    /* 用实例化摆放轮齿：60 齿也只有一次绘制调用 */
    const g = new THREE.BoxGeometry(width, height, depth);
    const mesh = new THREE.InstancedMesh(g, mat, count);
    const mtx = new THREE.Matrix4();
    const q = new THREE.Quaternion();
    const pos = new THREE.Vector3();
    const one = new THREE.Vector3(1, 1, 1);
    for (let k = 0; k < count; k++) {
      const a = (k / count) * Math.PI * 2;
      pos.set(Math.cos(a) * (r - dir * depth / 2), 0, Math.sin(a) * (r - dir * depth / 2));
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), -a);
      mtx.compose(pos, q, one);
      mesh.setMatrixAt(k, mtx);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  const parts = [];
  let explode = 0.62;          // 默认分离度：让内部啮合成为首屏事实

  /* 3.1 内齿圈（固定件）：壳体 + 60 个朝内的齿 */
  const ringGeo = new THREE.LatheGeometry([
    new THREE.Vector2(S.ringR, -S.h / 2),
    new THREE.Vector2(S.ringOut - 0.0015, -S.h / 2),
    new THREE.Vector2(S.ringOut, -S.h / 2 + 0.0015),
    new THREE.Vector2(S.ringOut, S.h / 2 - 0.0015),
    new THREE.Vector2(S.ringOut - 0.0015, S.h / 2),
    new THREE.Vector2(S.ringR, S.h / 2),
    new THREE.Vector2(S.ringR, -S.h / 2)
  ], 96);
  const ring = new THREE.Mesh(ringGeo, alu);
  ring.castShadow = ring.receiveShadow = true;
  ring.add(toothRing(S.zRing, rRing, 0.0032, S.h * 0.94, 0.004, steel, 1));
  root.add(ring);
  parts.push({ obj: ring, name: '内齿圈', body: `60 齿，固定于壳体。承担反扭矩，是传动比的基准。`, tag: '固定件 · 阳极氧化铝', lift: 0.015 });

  /* 3.2 太阳轮（输入）：18 齿，装在输入轴上 */
  const sunGroup = new THREE.Group();
  const sun = new THREE.Mesh(new THREE.CylinderGeometry(rSun, rSun, S.h, 48), steel);
  sun.castShadow = sun.receiveShadow = true;
  sunGroup.add(sun, toothRing(S.zSun, rSun, 0.0032, S.h * 0.94, 0.0045, steel, -1));
  const shaftIn = new THREE.Mesh(new THREE.CylinderGeometry(S.shaftInR, S.shaftInR, 0.052, 32), steel);
  shaftIn.position.y = -0.02;
  shaftIn.castShadow = true;
  sunGroup.add(shaftIn);
  root.add(sunGroup);
  parts.push({ obj: sunGroup, name: '太阳轮 + 输入轴', body: '18 齿，由电机驱动。转速经行星轮分流到三处啮合点，单齿载荷降到 1/3。', tag: '输入 · 20CrMnTi', lift: 0.125 });

  /* 3.3 行星轮 ×3：21 齿，沿圆周 120° 分布 */
  const planets = [];
  const planetR = rSun + rPlanet;
  for (let k = 0; k < 3; k++) {
    const a = k * Math.PI * 2 / 3;
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(rPlanet, rPlanet, S.h, 40), steel);
    body.castShadow = body.receiveShadow = true;
    g.add(body, toothRing(S.zPlanet, rPlanet, 0.0032, S.h * 0.94, 0.0045, steel, -1));
    const bush = new THREE.Mesh(new THREE.CylinderGeometry(S.pinR * 1.5, S.pinR * 1.5, S.h * 1.02, 24), bronze);
    g.add(bush);
    g.position.set(Math.cos(a) * planetR, 0, Math.sin(a) * planetR);
    root.add(g);
    planets.push(g);
    parts.push({ obj: g, name: `行星轮 ${k + 1}`, body: `21 齿，同时与太阳轮（外啮合）和内齿圈（内啮合）接触，自转同时公转。`, tag: '行星轮 · 20CrMnTi', lift: 0.105 });
  }

  /* 3.4 行星架（输出）：上下两块板 + 三根销轴 */
  const carrier = new THREE.Group();
  /* 上盖不用整圆板：真实行星架是三根辐条，也才能看见内部啮合 */
  const armGeo = new THREE.BoxGeometry(planetR + rPlanet * 0.8, S.plateT, 0.013);
  const plateTop = new THREE.Group();
  for (let k = 0; k < 3; k++) {
    const arm = new THREE.Mesh(armGeo, alu);
    arm.rotation.y = (k * Math.PI * 2) / 3;
    arm.position.set(
      Math.cos((k * Math.PI * 2) / 3) * (planetR) / 2,
      S.h / 2 + S.plateT / 2,
      Math.sin((k * Math.PI * 2) / 3) * (planetR) / 2
    );
    arm.castShadow = arm.receiveShadow = true;
    plateTop.add(arm);
  }
  carrier.add(plateTop);

  for (let k = 0; k < 3; k++) {
    const a = k * Math.PI * 2 / 3;
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(S.pinR, S.pinR, S.h + S.plateT * 3.2, 20), steel);
    pin.position.set(Math.cos(a) * planetR, -S.plateT * 0.9, Math.sin(a) * planetR);
    pin.castShadow = true;
    carrier.add(pin);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.0105, 0.0105, S.h + S.plateT * 1.4, 40), alu);
  hub.castShadow = true;
  carrier.add(hub);
  const shaftOut = new THREE.Mesh(new THREE.CylinderGeometry(S.shaftOutR, S.shaftOutR, 0.058, 32), steel);
  shaftOut.position.y = 0.03;
  shaftOut.castShadow = true;
  carrier.add(shaftOut);
  root.add(carrier);
  parts.push({ obj: carrier, name: '行星架 + 输出轴', body: `把三个行星轮的公转汇成一路输出，转速为输入的 1/${i.toFixed(2)}。`, tag: '输出 · 阳极氧化铝', lift: 0.225 });

  /* 3.5 底座：给接触阴影一个落点，避免主体漂浮 */
  /* 承影面：只接收阴影，不显示自身。物体不会漂浮，也不会有多余的圆盘抢画面 */
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(2.4, 2.4),
    new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.42 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.062;
  floor.receiveShadow = true;
  scene.add(floor);

  /* ============ 4. 三光制：主光定形体，补光留结构，轮廓光剥离背景 ============ */
  const key = new THREE.DirectionalLight(0xfff1d8, 2.9);
  key.position.set(0.28, 0.42, 0.26);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 0.05;
  key.shadow.camera.far = 1.4;
  key.shadow.bias = -0.0008;
  key.shadow.normalBias = 0.0015;
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xb9cdf5, 0.38);
  fill.position.set(-0.34, 0.16, 0.22);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xdfe9ff, 1.6);
  rim.position.set(-0.12, 0.3, -0.42);
  scene.add(rim);

  const hemi = new THREE.HemisphereLight(0x7f8ea8, 0x141312, 0.12);
  scene.add(hemi);

  /* ============ 5. 机位：由包围球推导，不填固定距离 ============ */
  applyExplode();                                   // 先分离，再量尺寸
  const bbox = new THREE.Box3().setFromObject(root);
  const sphere = bbox.getBoundingSphere(new THREE.Sphere());
  const dist = (sphere.radius + 0.02) / Math.sin((camera.fov * Math.PI / 180) / 2) * 0.96;
  const c0 = sphere.center;
  camera.position.set(c0.x + dist * 0.50, c0.y + dist * 0.44, c0.z + dist * 0.72);
  camera.lookAt(c0);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(c0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minPolarAngle = 0.22;
  controls.maxPolarAngle = 1.42;
  controls.minDistance = sphere.radius * 1.35;
  controls.maxDistance = sphere.radius * 4.2;
  controls.autoRotate = false;

  /* ============ 6. 拾取：点零件出说明卡，不靠图例猜 ============ */
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let hovered = null;

  function pick(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
    ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObject(root, true);
    if (!hits.length) return null;
    let o = hits[0].object;
    while (o && !parts.some(p => p.obj === o)) o = o.parent;
    return parts.find(p => p.obj === o) || null;
  }

  renderer.domElement.addEventListener('pointerdown', (ev) => {
    const hit = pick(ev);
    if (!hit) { card.removeAttribute('data-on'); return; }
    cardTitle.textContent = hit.name;
    cardBody.textContent = hit.body;
    cardTag.textContent = hit.tag;
    card.setAttribute('data-on', '');
  });

  /* ============ 7. 爆炸视图：沿 Y 分离，滑块只改位移不改几何 ============ */
  explodeEl.addEventListener('input', () => {
    explode = Number(explodeEl.value) / 100;
    explodeVal.textContent = `${explodeEl.value}%`;
  });

  function applyExplode() {
    for (const p of parts) p.obj.position.y = p.lift * explode;
  }


  /* ============ 8. 运动：按威利斯方程联动，不是各转各的 ============ */
  const speed = 0.42;          // rad/s，太阳轮
  let angSun = 0;
  function animateGears(dt) {
    angSun += speed * dt;
    sunGroup.rotation.y = -angSun;
    /* 行星轮自转 = -(zSun/zPlanet) * θsun */
    const spin = -(S.zSun / S.zPlanet) * angSun;
    for (const g of planets) {
      g.rotation.y = spin;
      /* 公转：行星架转角 = θsun * zSun/(zSun+zRing) */
      const carrierAng = angSun * S.zSun / (S.zSun + S.zRing);
      const a0 = planets.indexOf(g) * Math.PI * 2 / 3;
      const rr = planetR + 0.090 * explode;   // 必须越过齿圈外壁，否则穿模   // 爆炸时径向分开
      g.position.set(
        Math.cos(a0 + carrierAng) * rr,
        0.105 * explode,
        Math.sin(a0 + carrierAng) * rr
      );
    }
    carrier.rotation.y = angSun * S.zSun / (S.zSun + S.zRing);
  }

  /* ============ 9. 循环：限 dt、后台暂停、resize 重算 ============ */
  let last = performance.now();
  let running = true;

  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running) last = performance.now();
  });

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight);
  }
  addEventListener('resize', resize);

  function loop(now) {
    requestAnimationFrame(loop);
    if (!running) return;
    let dt = (now - last) / 1000;
    dt = Math.min(dt, 0.05);          // 钳制：切回标签页不会大跳
    last = now;
    animateGears(dt);
    applyExplode();
    controls.update();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
